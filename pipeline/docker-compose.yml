# Local development database. Production runs Postgres natively on the Oracle server.
# Start: docker compose up -d   (run inside pipeline/; reads HALOAI_DB_PASSWORD from .env)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: haloai
      POSTGRES_PASSWORD: ${HALOAI_DB_PASSWORD:?set HALOAI_DB_PASSWORD in pipeline/.env}
      POSTGRES_DB: haloai
    ports:
      # Bound to localhost only: the database is never reachable from the network.
      - "127.0.0.1:5433:5432"
    volumes:
      - haloai_pg:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haloai -d haloai"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  haloai_pg:
